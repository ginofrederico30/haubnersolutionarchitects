<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="heroIllustrationTitle">
  <title id="heroIllustrationTitle">Illustration of two solution architects reviewing a NetSuite dashboard together</title>

  <!-- soft backing shape -->
  <circle cx="300" cy="240" r="210" fill="#FFFFFF" opacity="0.06"/>

  <!-- dashboard / screen -->
  <rect x="150" y="70" width="330" height="230" rx="14" fill="#F0F4FF"/>
  <rect x="150" y="70" width="330" height="46" rx="14" fill="#FFFFFF"/>
  <circle cx="174" cy="93" r="5" fill="#4671F1"/>
  <circle cx="192" cy="93" r="5" fill="#291D89" opacity="0.35"/>
  <circle cx="210" cy="93" r="5" fill="#291D89" opacity="0.35"/>

  <!-- bar chart -->
  <rect x="178" y="200" width="26" height="76" rx="4" fill="#4671F1"/>
  <rect x="214" y="170" width="26" height="106" rx="4" fill="#291D89"/>
  <rect x="250" y="222" width="26" height="54" rx="4" fill="#4671F1" opacity="0.55"/>
  <rect x="286" y="150" width="26" height="126" rx="4" fill="#291D89" opacity="0.85"/>

  <!-- line trend -->
  <polyline points="330,240 360,205 390,225 420,160 452,185" fill="none" stroke="#4671F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="452" cy="185" r="6" fill="#4671F1"/>

  <!-- node / "N" motif accent -->
  <path d="M320 140 L338 108 L356 140" fill="none" stroke="#4671F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- desk / surface -->
  <rect x="60" y="360" width="440" height="16" rx="8" fill="#FFFFFF" opacity="0.12"/>

  <!-- person 1 -->
  <g>
    <circle cx="182" cy="330" r="26" fill="#F0F4FF"/>
    <path d="M140 400c4-34 30-52 42-52s38 18 42 52" fill="#4671F1"/>
  </g>

  <!-- person 2 -->
  <g>
    <circle cx="300" cy="342" r="24" fill="#F0F4FF"/>
    <path d="M262 402c4-30 28-46 38-46s34 16 38 46" fill="#291D89"/>
  </g>

  <!-- person 2 pointing arm -->
  <path d="M320 372 L360 340" stroke="#291D89" stroke-width="10" stroke-linecap="round"/>

  <!-- floating check badge -->
  <circle cx="428" cy="330" r="22" fill="#4671F1"/>
  <path d="M418 330l7 7 15-15" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
